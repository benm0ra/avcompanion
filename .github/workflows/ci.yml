name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

# The workflow only reads the repository. It holds no secrets.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Audio core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p av-core
      - name: Stream Deck plugin tests
        run: node --test plugin/test/plugin.test.js

  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Validate Stream Deck plugin
        run: npx streamdeck validate plugin/com.avcompanion.control.sdPlugin
        continue-on-error: true
      - name: Fetch VB-CABLE driver pack (optional add-on, unmodified)
        shell: pwsh
        run: |
          $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip"
          Invoke-WebRequest $url -OutFile vbcable.zip
          $hash = (Get-FileHash vbcable.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "VB-CABLE pack sha256: $hash"
          $pin = (Get-Content src-tauri/vendor/vbcable.sha256 -Raw).Trim().ToLower()
          if ($pin -eq "unpinned") {
            Write-Host "::warning::VB-CABLE pack hash is not pinned yet"
          } elseif ($pin -ne $hash) {
            throw "VB-CABLE pack does not match the pinned SHA-256 ($pin). Refusing to bundle it."
          }
          Expand-Archive vbcable.zip -DestinationPath src-tauri/vendor/vbcable -Force
          Remove-Item vbcable.zip
          Get-ChildItem -Recurse src-tauri/vendor/vbcable | ForEach-Object { $_.FullName }
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: AVcompanion-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lockfiles
          path: |
            src-tauri/Cargo.lock
            package-lock.json
