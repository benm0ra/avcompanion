name: CI
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository. It holds no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Audio core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p av-core
      - name: Stream Deck plugin tests
        run: node --test plugin/test/plugin.test.js

  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Validate Stream Deck plugin
        run: npx streamdeck validate plugin/com.avcompanion.control.sdPlugin
        continue-on-error: true
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: AVcompanion-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
